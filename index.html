<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>함독도 · ONEUP 대표이사</title>
    <meta
      name="description"
      content="함독도 — ONEUP 대표이사. CURSOR랑 같이 놀사람?"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="grid"></span>
    </div>

    <main class="stage">
      <section class="intro" aria-labelledby="name">
        <div class="portrait" id="portrait">
          <svg
            class="character"
            viewBox="0 0 240 240"
            role="img"
            aria-label="함독도를 표현한 못생긴 캐릭터 일러스트"
          >
            <defs>
              <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#D8B08A" />
                <stop offset="100%" stop-color="#B88862" />
              </linearGradient>
              <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#2A3330" />
                <stop offset="100%" stop-color="#151B19" />
              </linearGradient>
            </defs>

            <!-- suit shoulders -->
            <path d="M30 232c8-50 36-78 90-78s82 28 90 78" fill="url(#suit)" />
            <path d="M108 168l12 42 12-42" fill="#0B1210" />
            <path d="M112 170h16v28h-16z" fill="#C8F542" opacity="0.85" />

            <!-- thick neck -->
            <ellipse cx="120" cy="178" rx="28" ry="18" fill="#A87652" />

            <!-- giant ears -->
            <ellipse cx="42" cy="118" rx="18" ry="28" fill="#A87652" />
            <ellipse cx="198" cy="118" rx="18" ry="28" fill="#A87652" />
            <ellipse cx="42" cy="118" rx="8" ry="14" fill="#8F6142" />
            <ellipse cx="198" cy="118" rx="8" ry="14" fill="#8F6142" />

            <!-- lumpy head -->
            <path
              d="M58 140c-8-40 8-78 42-90 18-8 40-6 56 4 22 14 34 42 30 78-2 18-10 34-24 44-20 14-48 16-70 6-18-8-30-24-34-42z"
              fill="url(#skin)"
            />

            <!-- balding / weird hair tufts -->
            <path d="M78 62c10-8 22-10 34-6l-6 18c-12-2-22 0-28-4z" fill="#3A2A1A" />
            <path d="M140 56c12-4 26 0 36 10l-14 12c-8-8-16-12-22-10z" fill="#3A2A1A" />
            <circle cx="118" cy="54" r="7" fill="#3A2A1A" />

            <!-- forehead wrinkles -->
            <path d="M78 88h50" stroke="#9A6D4A" stroke-width="2" stroke-linecap="round" />
            <path d="M84 96h42" stroke="#9A6D4A" stroke-width="2" stroke-linecap="round" />

            <!-- mismatched brows -->
            <path d="M70 104c16-2 28 8 36 4" stroke="#2A1F14" stroke-width="5" stroke-linecap="round" fill="none" />
            <path d="M132 98c10 10 28 14 42 2" stroke="#2A1F14" stroke-width="5" stroke-linecap="round" fill="none" />

            <!-- eyes (mismatched, googly) -->
            <g class="eyes" id="eyes">
              <ellipse class="eye-white" cx="90" cy="126" rx="18" ry="22" fill="#FFF8E8" />
              <ellipse class="eye-white" cx="152" cy="122" rx="12" ry="10" fill="#FFF8E8" />
              <circle class="pupil" cx="96" cy="132" r="8" fill="#1A1F24" />
              <circle class="pupil" cx="148" cy="124" r="4.5" fill="#1A1F24" />
              <circle cx="99" cy="128" r="2.5" fill="#FFFDF8" />
              <circle cx="149" cy="122" r="1.5" fill="#FFFDF8" />
            </g>

            <!-- bags under eyes -->
            <path d="M74 146c10 8 26 8 36 0" stroke="#8F6142" stroke-width="2.5" fill="none" stroke-linecap="round" />
            <path d="M140 134c8 6 20 6 28 0" stroke="#8F6142" stroke-width="2" fill="none" stroke-linecap="round" />

            <!-- big potato nose -->
            <ellipse cx="122" cy="148" rx="16" ry="14" fill="#A86A48" />
            <ellipse cx="114" cy="150" rx="3" ry="4" fill="#7A4A32" opacity="0.7" />
            <ellipse cx="130" cy="150" rx="3" ry="4" fill="#7A4A32" opacity="0.7" />

            <!-- crooked buck teeth smile -->
            <path
              class="smile"
              d="M88 168c8 18 40 22 58 4"
              stroke="#2A1F14"
              stroke-width="4"
              stroke-linecap="round"
              fill="none"
            />
            <rect x="108" y="168" width="10" height="14" rx="1" fill="#F5F0E0" />
            <rect x="120" y="170" width="9" height="16" rx="1" fill="#EDE6D0" transform="rotate(8 124 178)" />

            <!-- mole & stubble -->
            <circle cx="168" cy="150" r="4" fill="#6B4630" />
            <g opacity="0.35" stroke="#3A2A1A" stroke-width="1.2">
              <line x1="78" y1="160" x2="74" y2="168" />
              <line x1="90" y1="172" x2="88" y2="180" />
              <line x1="150" y1="168" x2="154" y2="176" />
              <line x1="164" y1="160" x2="170" y2="166" />
              <line x1="100" y1="184" x2="98" y2="192" />
              <line x1="140" y1="182" x2="142" y2="190" />
            </g>

            <!-- crooked glasses -->
            <g transform="rotate(-8 120 120)">
              <rect x="70" y="110" width="42" height="34" rx="6" fill="none" stroke="#C8F542" stroke-width="3" />
              <rect x="128" y="106" width="36" height="28" rx="6" fill="none" stroke="#C8F542" stroke-width="3" />
              <path d="M112 124h16" stroke="#C8F542" stroke-width="3" stroke-linecap="round" />
            </g>

            <g class="spark" opacity="0.9">
              <text x="176" y="58" font-size="18" font-family="IBM Plex Sans KR, sans-serif" fill="#C8F542">?</text>
            </g>
          </svg>
        </div>

        <p class="eyebrow">Web Card</p>
        <h1 id="name">함독도</h1>
        <p class="role">ONEUP 대표이사</p>
        <p class="tagline">CURSOR랑 같이 놀사람?</p>

        <ul class="contacts" role="list">
          <li>
            <button
              type="button"
              class="contact"
              data-copy="hsysh9393@naver.com"
              aria-label="이메일 복사"
            >
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8" />
                  <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>
              <span class="contact-text">
                <span class="label">Email</span>
                <span class="value">hsysh9393@naver.com</span>
              </span>
            </button>
          </li>
          <li>
            <button
              type="button"
              class="contact"
              data-copy="010-4941-9393"
              aria-label="전화번호 복사"
            >
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path
                    d="M8.5 4.5h3l1 4-2 1.5a10 10 0 0 0 4.5 4.5l1.5-2 4 1v3a2 2 0 0 1-2.2 2A14.5 14.5 0 0 1 4.5 6.7 2 2 0 0 1 6.5 4.5h2z"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              <span class="contact-text">
                <span class="label">Phone</span>
                <span class="value">010-4941-9393</span>
              </span>
            </button>
          </li>
          <li>
            <a
              class="contact contact-link"
              href="https://www.linkedin.com"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="링크드인으로 이동"
            >
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.8" />
                  <path d="M8 10.5v6M8 7.5v.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                  <path d="M12 16.5v-4a2.5 2.5 0 0 1 5 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
              </span>
              <span class="contact-text">
                <span class="label">LinkedIn</span>
                <span class="value">www.linkedin.com</span>
              </span>
            </a>
          </li>
          <li>
            <a
              class="contact contact-link"
              href="https://www.youtube.com"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="유튜브로 이동"
            >
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect x="2.5" y="6" width="19" height="12" rx="3.5" stroke="currentColor" stroke-width="1.8" />
                  <path d="M11 10.2v3.6l3.2-1.8L11 10.2z" fill="currentColor" />
                </svg>
              </span>
              <span class="contact-text">
                <span class="label">YouTube</span>
                <span class="value">www.youtube.com</span>
              </span>
            </a>
          </li>
        </ul>

        <p class="toast" id="toast" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
